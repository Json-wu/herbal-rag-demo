name: 构建镜像并部署

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPO: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/herbal-rag-demo
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/herbal-rag' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v7.0.1

      - name: 检查 Secrets
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
          ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          [ -n "$ALIYUN_REGISTRY" ] || { echo "缺少 GitHub Secret: ALIYUN_REGISTRY"; missing=1; }
          [ -n "$ALIYUN_NAMESPACE" ] || { echo "缺少 GitHub Secret: ALIYUN_NAMESPACE"; missing=1; }
          [ -n "$ALIYUN_REGISTRY_USER" ] || { echo "缺少 GitHub Secret: ALIYUN_REGISTRY_USER"; missing=1; }
          [ -n "$ALIYUN_REGISTRY_PASSWORD" ] || { echo "缺少 GitHub Secret: ALIYUN_REGISTRY_PASSWORD"; missing=1; }
          [ -n "$SSH_HOST" ] || { echo "缺少 GitHub Secret: SSH_HOST"; missing=1; }
          [ -n "$SSH_USER" ] || { echo "缺少 GitHub Secret: SSH_USER"; missing=1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "缺少 GitHub Secret: SSH_PRIVATE_KEY"; missing=1; }
          exit "$missing"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}

      - name: 创建服务器目录
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 2m
          envs: DEPLOY_PATH
          script: mkdir -p "$DEPLOY_PATH"

      - name: 上传部署文件
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy/docker-compose.prod.yml,deploy/update.sh
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: 拉取镜像并重启
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          IMAGE: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          envs: DEPLOY_PATH,IMAGE,ALIYUN_REGISTRY,ALIYUN_REGISTRY_USER,ALIYUN_REGISTRY_PASSWORD
          script: sh "$DEPLOY_PATH/update.sh"

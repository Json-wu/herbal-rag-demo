name: herbal-rag

services:
  herbal-rag:
    image: ${HERBAL_IMAGE:?HERBAL_IMAGE is required}
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - herbal-index:/app/data/index
      - herbal-uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  herbal-index:
  herbal-uploads:

name: herbal-rag

services:
  herbal-rag:
    # 部署时由 deploy/update.sh 传入，值为
    # $ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/herbal-rag-demo:<本次提交 SHA>
    image: ${HERBAL_IMAGE:?HERBAL_IMAGE is required}
    ports:
      - "4004:4004"
    environment:
      # 香港等能访问 GitHub 的机器：启动时拉取选定古籍。已在索引中则跳过。
      TCMOC_IMPORT: "1"
    env_file:
      - .env
    volumes:
      - herbal-index:/app/data/index
      - herbal-uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  herbal-index:
  herbal-uploads:

name: herbal-rag

services:
  herbal-rag:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - herbal-index:/app/data/index
      - herbal-uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  herbal-index:
  herbal-uploads:
